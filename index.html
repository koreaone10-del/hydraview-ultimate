<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydraView Ultimate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="controls">
        <textarea id="urlsInput" placeholder="أدخل روابط يوتيوب... (رابط في كل سطر)"></textarea>
        <div class="row">
            <label>عدد النوافذ: <input type="number" id="countInput" value="2" min="1" max="4"></label>

            <button id="stopBtn">⏹ إيقاف الكل</button>
            <span id="proxyStats">البروكسيات: 0</span>
        </div>
    </div>
    <div id="grid"></div>
    <script src="script.js"></script>
</body>
</html>
